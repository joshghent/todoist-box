name: Test
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node_modules- # Take any latest cache if failed to find it for current package-lock.json
      - run: npm install
      - run: npm run build
      # Dependabot runs get Dependabot secrets, not these, so the live run
      # would fail on missing env vars. The build above still covers them.
      - run: node ./dist/index.js
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TODOIST_AUTH_CODE: ${{ secrets.TODOIST_AUTH_CODE }}
          TODOIST_API_KEY: ${{ secrets.TODOIST_API_KEY }}
          TODOIST_CLIENT_ID: ${{ secrets.TODOIST_CLIENT_ID }}
          TODOIST_CLIENT_SECRET: ${{ secrets.TODOIST_CLIENT_SECRET }}
